<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DC Audit (local)</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0e1117; color: #fafafa;
         display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; }
  .card { max-width: 440px; text-align: center; }
  a.btn { display: inline-block; background: #ff4b4b; color: #fff; padding: 12px 22px;
          border-radius: 8px; text-decoration: none; font-weight: 600; margin: 16px 0; }
  p { color: #b0b3b8; line-height: 1.5; }
  code { background: #262730; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="card">
    <h1>📋 DC Audit Report</h1>
    <a class="btn" href="http://localhost:8501">Open the app</a>
    <p>If the page won't load, the app isn't running yet. Double-click
       <code>Run DC Audit.cmd</code> in this folder, then click the button again.</p>
  </div>
</body>
</html>
